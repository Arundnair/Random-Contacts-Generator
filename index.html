<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management System</title>
    <!-- bs -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background-color: aqua;">

<div class="container mt-5">
  <h1 class="text-center">Contact Management System</h1>
</div>

<div class="container mt-5">
  <div class="row">
    <div class="col-md-5">
      <h2>Add Contact</h2>
      <form id="contactForm">
      <div class="mb-3">
      <label for="contactName" class="form-label">Name</label>
      <input type="text" class="form-control" id="contactName" required>
      </div>

      <div class="mb-3">
        <label for="contactPhone" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="contactPhone" required>
      </div>

      <div class="mb-3">
       <label for="contactEmail" class="form-label">Email Address</label>
       <input type="email" class="form-control" id="contactEmail" required>
      </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">
          Add Contact</button>
        </form>
    </div>

   <div class="col-md-7">
    <h2 class="text-center">Contact List</h2>
       <input type="text" class="form-control mt-3 mb-3" id="searchContact" placeholder="Search contacts by name">
       <table class="table table-bordered mt-3">
        <thead>
         <tr>
          <th>Name</th>
          <th>Phone Number</th>
          <th>Email Address</th>
          <th>Tools</th>
        </tr>
        </thead>

        <tbody id="contactList"></tbody>
       </table>
   </div>

  <div>
  </div>

<script>
let contacts = JSON.parse(sessionStorage.getItem("contacts")) || [];
let editIndex = null;

const form = document.getElementById("contactForm");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    let name = document.getElementById("contactName").value.trim();
    let phone = document.getElementById("contactPhone").value.trim();
    let email = document.getElementById("contactEmail").value.trim();

    if (!name || !phone || !email) {
        alert("Please fill all fields");
        return;
    }

if (editIndex !== null) {
    contacts[editIndex] = {
        name: name,
        phone: phone,
        email: email
    };
} else {
    contacts.push({
        name: name,
        phone: phone,
        email: email
    });
}
sessionStorage.setItem("contacts", JSON.stringify(contacts));
form.reset();
displayContacts();
});


function displayContacts(data = contacts) {
    let list = document.getElementById("contactList");

    list.innerHTML = "";

    data.forEach((contact) => {
        let index = contacts.indexOf(contact);

        list.innerHTML += `
         <tr>
            <td>${contact.name}</td>
            <td>${contact.phone}</td>
            <td>${contact.email}</td>
            <td>
              <button class="btn btn-warning btn-sm me-1" onclick="editContact(${index})">
                Edit
               </button>
               <button class="btn btn-danger btn-sm" onclick="deleteContact(${index})">
                 Delete
                </button>
            </td>
        </tr>
    `;
  });
}


function editContact(index) {
    let contact = contacts[index];
    editIndex = index;

    document.getElementById("contactName").value = contact.name;
    document.getElementById("contactPhone").value = contact.phone;
    document.getElementById("contactEmail").value = contact.email;
    document.getElementById("submitBtn").textContent = "Update Contact";
}
function deleteContact(index) {
    if (!confirm("Are you sure you want to delete this contact?")) {
        return;
    }

    contacts = contacts.filter((contact, i) => i !== index);
    sessionStorage.setItem("contacts", JSON.stringify(contacts));
    
    if (editIndex === index) {
        editIndex = null;
        form.reset();
        document.getElementById("submitBtn").textContent = "Add Contact";
    }

    displayContacts();
}
document.getElementById("searchContact").addEventListener("input", function() {
    let searchValue = this.value.toLowerCase();
    let filteredContacts = contacts.filter(contact =>
        contact.name.toLowerCase().includes(searchValue)
    );

    displayContacts(filteredContacts);
});

displayContacts();
</script>

</body>
</html>
